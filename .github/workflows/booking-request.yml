name: Booking request
on: {issues: {types: [opened]}}
permissions: {contents: write, pull-requests: write, issues: write}
jobs:
  pr:
    if: contains(github.event.issue.labels.*.name, 'booking')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          BODY: ${{ github.event.issue.body }}
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number }}
        run: |
          f=$(python scripts/issue_to_booking.py)
          if ! out=$(python scripts/build.py --check 2>&1); then
            gh issue comment $N --body "Request not possible: $out"
            gh issue close $N; exit 0
          fi
          git config user.name github-actions; git config user.email actions@github.com
          git checkout -b booking-$N; git add "$f"; git commit -m "Booking request #$N"
          git push origin booking-$N
          gh pr create --base main --head booking-$N --title "Booking: $(basename $f .json)" --body "Requested in #$N. Approve to confirm the beds."
