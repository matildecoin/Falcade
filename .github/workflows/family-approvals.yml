name: Calendar guard
on:
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: read
  pull-requests: read
  statuses: write
concurrency:
  group: calendar-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the proposed booking and report its approval status
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          state=success
          description="No booking or presence record requires extra validation"
          if ! gh api --paginate --jq '.[].filename' "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" > changed-files.txt; then
            state=failure
            description="Could not inspect the pull request files"
          else
            mapfile -t changed_files < changed-files.txt
            record_kind=""
            for path in "${changed_files[@]}"; do
              if [[ "$path" == bookings/* ]]; then record_kind=booking; fi
              if [[ "$path" == presences/* ]]; then record_kind=presence; fi
            done
            if [ -n "$record_kind" ]; then
              state=failure
              description="Calendar record is invalid or missing required family approvals"
            fi
            if [ -n "$record_kind" ] && [ "${#changed_files[@]}" -eq 1 ] &&
               [[ "${changed_files[0]}" =~ ^${record_kind}s/issue-[0-9]+\.json$ ]]; then
              file="${changed_files[0]}"
              if [ "$record_kind" = "presence" ] ||
                 gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" > reviews.json; then
                mkdir -p "${record_kind}s"
                if gh api "repos/$GITHUB_REPOSITORY/contents/$file?ref=$PR_HEAD_SHA" --jq .content |
                     base64 -d > "$file" &&
                   python scripts/build.py --check; then
                  if [ "$record_kind" = "presence" ]; then
                    state=success
                    description="Presence record is valid"
                  elif python scripts/check_approvals.py reviews.json "$PR_HEAD_SHA"; then
                    state=success
                    description="Booking data is valid and every family nucleus approved"
                  fi
                fi
              fi
            fi
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$PR_HEAD_SHA" \
            -f state="$state" \
            -f context="calendar-guard" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >/dev/null
          if [ "$state" != success ]; then exit 1; fi
